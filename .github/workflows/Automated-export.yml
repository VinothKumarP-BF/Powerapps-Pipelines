name: Export Automated Managed Solutions
 
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version
        required: true
        default: "0.0.0.0"
      ab_number:
        description: AB number
        required: true
 
env:
  TARGET_BRANCH: Managed_Solutions
  PAC_CLI_VERSION: 2.9.3
 
jobs:
  export:
    runs-on: windows-latest
    environment: DEV
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Checkout YAML
        uses: actions/checkout@v4
        with:
          ref: yaml
          path: yaml-config
 
      - name: Install PAC CLI
        run: |
          dotnet tool update --global Microsoft.PowerApps.CLI.Tool --version ${{ env.PAC_CLI_VERSION }} || dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version ${{ env.PAC_CLI_VERSION }}
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
 
      - name: Authenticate
        run: |
          pac auth create --url ${{ secrets.DEV_ENV_URL }} --applicationId ${{ secrets.CLIENT_ID }} --clientSecret ${{ secrets.CLIENT_SECRET }} --tenant ${{ secrets.TENANT_ID }}
 
      - name: Export solutions
        shell: bash
        run: |
          set -e
      
          SOLUTIONS_FILE="yaml-config/.github/workflows/solutions.yml"
          RELEASE_FOLDER="Releases/v${{ github.event.inputs.release_version }}"
      
          mkdir -p "$RELEASE_FOLDER"
      
          while IFS= read -r line; do
            # Remove CR from Windows line endings
            line=$(echo "$line" | tr -d '\r')
      
            # Skip comments and empty lines
            [[ -z "$line" || "$line" =~ ^# ]] && continue
      
            # Remove leading "- "
            SOLUTION=$(echo "$line" | sed 's/^[[:space:]]*-[[:space:]]*//')
      
            echo "Exporting: $SOLUTION"
      
            ZIP_FILE="${RUNNER_TEMP}/${SOLUTION}.zip"
      
            rm -rf "$RELEASE_FOLDER/$SOLUTION"
      
            pac solution export \
              --name "$SOLUTION" \
              --path "$ZIP_FILE" \
              --managed \
              --overwrite true
      
            pac solution unpack \
              --zipfile "$ZIP_FILE" \
              --folder "$RELEASE_FOLDER/$SOLUTION" \
              --packagetype Managed
      
          done < "$SOLUTIONS_FILE"
 
      - name: Commit and push
        shell: bash
        run: |
          AB_NUMBER="${{ github.event.inputs.ab_number }}"
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          if [[ ! "$AB_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ab_number must be digits only"
            exit 1
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Releases/
          git commit -m "AB#$AB_NUMBER Release v$RELEASE_VERSION" || echo "No changes detected"
          git push origin $TARGET_BRANCH
