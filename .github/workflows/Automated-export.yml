name: Export Automated Managed Solutions
 
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version
        required: true
        default: "0.0.0.0"
      ab_number:
        description: AB number
        required: true
 
permissions:
  contents: write
 
env:
  TARGET_BRANCH: Managed_Solutions
  PAC_CLI_VERSION: 2.9.3
  LOG_SCRIPT: log-script/.github/power-platform/export_log.py
 
jobs:
  export:
    runs-on: windows-latest
    environment: DEV
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
 
      - name: Checkout YAML
        uses: actions/checkout@v4
        with:
          ref: yaml
          path: yaml-config
 
      - name: Checkout log script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: log-script
          sparse-checkout: .github/power-platform
 
      - name: Install PAC CLI
        shell: bash
        run: |
          dotnet tool update --global Microsoft.PowerApps.CLI.Tool --version ${{ env.PAC_CLI_VERSION }} || dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version ${{ env.PAC_CLI_VERSION }}
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
 
      - name: Authenticate
        shell: bash
        run: |
          pac auth create --url ${{ secrets.DEV_ENV_URL }} --applicationId ${{ secrets.CLIENT_ID }} --clientSecret ${{ secrets.CLIENT_SECRET }} --tenant ${{ secrets.TENANT_ID }}
 
      - name: Export solutions
        shell: bash
        run: |
          set -e
          python "$LOG_SCRIPT" start "export"
          SOLUTIONS_FILE="yaml-config/.github/workflows/solutions.yml"
          RELEASE_FOLDER="Releases/v${{ github.event.inputs.release_version }}"
          mkdir -p "$RELEASE_FOLDER"
          python "$LOG_SCRIPT" step "release folder $RELEASE_FOLDER"
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            trim="${line#"${line%%[![:space:]]*}"}"
            case "$trim" in
              ""|\#*) continue ;;
            esac
            SOLUTION=$(printf '%s\n' "$trim" | sed 's/^- //')
            echo "Exporting $SOLUTION"
            python "$LOG_SCRIPT" solution-start "$SOLUTION"
            ZIP_FILE="${RUNNER_TEMP}/${SOLUTION}.zip"
            rm -rf "$RELEASE_FOLDER/$SOLUTION"
            pac solution export --name "$SOLUTION" --path "$ZIP_FILE" --managed --overwrite true
            python "$LOG_SCRIPT" solution-export-ok "$SOLUTION"
            pac solution unpack --zipfile "$ZIP_FILE" --folder "$RELEASE_FOLDER/$SOLUTION" --packagetype Managed
            python "$LOG_SCRIPT" solution-unpack-ok "$SOLUTION"
          done < "$SOLUTIONS_FILE"
          python "$LOG_SCRIPT" finish "export"
 
      - name: Commit and push
        shell: bash
        run: |
          AB_NUMBER="${{ github.event.inputs.ab_number }}"
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          if [[ ! "$AB_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ab_number must be digits only"
            exit 1
          fi
          python "$LOG_SCRIPT" step "commit started"
          python "$LOG_SCRIPT" step "AB#$AB_NUMBER Release v$RELEASE_VERSION"
          python "$LOG_SCRIPT" step "push starting"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Releases/
          git commit -m "AB#$AB_NUMBER Release v$RELEASE_VERSION" || echo "No changes detected"
          git push origin $TARGET_BRANCH
          python "$LOG_SCRIPT" finish "pushed $TARGET_BRANCH"
 
      - name: Publish export log
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: python "$LOG_SCRIPT" publish
