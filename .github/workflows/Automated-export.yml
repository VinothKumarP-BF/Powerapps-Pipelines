name: Export Automated Managed Solutions
 
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version
        required: true
        default: "0.0.0.0"
      ab_number:
        description: AB number
        required: true
 
permissions:
  contents: write
 
env:
  TARGET_BRANCH: Managed_Solutions
  PAC_CLI_VERSION: 2.9.3
 
jobs:
  export:
    runs-on: windows-latest
    environment: DEV
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
 
      - name: Checkout YAML
        uses: actions/checkout@v4
        with:
          ref: yaml
          path: yaml-config
 
      - name: Install PAC CLI
        shell: bash
        run: |
          dotnet tool update --global Microsoft.PowerApps.CLI.Tool --version ${{ env.PAC_CLI_VERSION }} || dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version ${{ env.PAC_CLI_VERSION }}
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
 
      - name: Authenticate
        shell: bash
        run: |
          pac auth create --url ${{ secrets.DEV_ENV_URL }} --applicationId ${{ secrets.CLIENT_ID }} --clientSecret ${{ secrets.CLIENT_SECRET }} --tenant ${{ secrets.TENANT_ID }}
 
      - name: Export solutions
        shell: bash
        run: |
          set -e
          SOLUTIONS_FILE="yaml-config/.github/workflows/solutions.yml"
          RELEASE_FOLDER="Releases/v${{ github.event.inputs.release_version }}"
          mkdir -p "$RELEASE_FOLDER"
          LOG_FILE="$RELEASE_FOLDER/export-log.txt"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) export started" >> "$LOG_FILE"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) release folder $RELEASE_FOLDER" >> "$LOG_FILE"
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            trim="${line#"${line%%[![:space:]]*}"}"
            case "$trim" in
              ""|\#*) continue ;;
            esac
            SOLUTION=$(printf '%s\n' "$trim" | sed 's/^- //')
            echo "Exporting $SOLUTION"
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $SOLUTION started" >> "$LOG_FILE"
            ZIP_FILE="${RUNNER_TEMP}/${SOLUTION}.zip"
            rm -rf "$RELEASE_FOLDER/$SOLUTION"
            pac solution export --name "$SOLUTION" --path "$ZIP_FILE" --managed --overwrite true
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $SOLUTION export succeeded" >> "$LOG_FILE"
            pac solution unpack --zipfile "$ZIP_FILE" --folder "$RELEASE_FOLDER/$SOLUTION" --packagetype Managed
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $SOLUTION unpack succeeded" >> "$LOG_FILE"
          done < "$SOLUTIONS_FILE"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) export finished" >> "$LOG_FILE"
 
      - name: Commit and push
        shell: bash
        run: |
          AB_NUMBER="${{ github.event.inputs.ab_number }}"
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          RELEASE_FOLDER="Releases/v$RELEASE_VERSION"
          LOG_FILE="$RELEASE_FOLDER/export-log.txt"
          if [[ ! "$AB_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ab_number must be digits only"
            exit 1
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) commit started" >> "$LOG_FILE"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) AB#$AB_NUMBER Release v$RELEASE_VERSION" >> "$LOG_FILE"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) push starting" >> "$LOG_FILE"
          git add Releases/
          git commit -m "AB#$AB_NUMBER Release v$RELEASE_VERSION" || echo "No changes detected"
          git push origin $TARGET_BRANCH
