name: Export Automated Managed Solutions
 
on:
  workflow_dispatch:
 
permissions:
  contents: write
 
env:
  TARGET_BRANCH: CMdS-Sprint4-DEV2
  PAC_CLI_VERSION: "2.9.3"
 
jobs:
  export:
    runs-on: cmds-nextgenprv-lower-runner-ghhosted
    environment: DEV
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
 
      - name: Checkout solution branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          path: release
 
      - name: Initialize log
        shell: pwsh
        run: ./scripts/logging/Write-DeploymentLog.ps1 -Action Init
 
      - name: Install PAC CLI
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./scripts/logging/Write-DeploymentLog.ps1 -Action Stage -Stage install
          dotnet tool update --global Microsoft.PowerApps.CLI.Tool --version ${{ env.PAC_CLI_VERSION }} || dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version ${{ env.PAC_CLI_VERSION }}
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          pwsh -NoProfile -File ./scripts/logging/Write-DeploymentLog.ps1 -Action Info -Message "PAC CLI ${PAC_CLI_VERSION} installed"
 
      - name: Authenticate
        shell: bash
        env:
          PAC_URL: ${{ secrets.CMDS_NEXTGENPEM_DEV_URL }}
          PAC_APP_ID: ${{ vars.CMDS_NEXTGENPEM_DEV_PP_APPID }}
          PAC_CLIENT_SECRET: ${{ secrets.CMDS_NEXTGENPEM_DEV_PP }}
          PAC_TENANT_ID: ${{ vars.CMDS_NEXTGENPEM_DEV_TENANTID }}
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./scripts/logging/Write-DeploymentLog.ps1 -Action Stage -Stage authentication
          if [[ -z "${PAC_URL}" || -z "${PAC_APP_ID}" || -z "${PAC_CLIENT_SECRET}" || -z "${PAC_TENANT_ID}" ]]; then
            pwsh -NoProfile -File ./scripts/logging/Write-DeploymentLog.ps1 -Action Error -Stage authentication -Message "secret unavailable CMDS DEV credential"
            exit 1
          fi
          if ! pac auth create --url "$PAC_URL" --applicationId "$PAC_APP_ID" --clientSecret "$PAC_CLIENT_SECRET" --tenant "$PAC_TENANT_ID"; then
            pwsh -NoProfile -File ./scripts/logging/Write-DeploymentLog.ps1 -Action Error -Stage authentication -Message "authentication failed"
            exit 1
          fi
          pwsh -NoProfile -File ./scripts/logging/Write-DeploymentLog.ps1 -Action Info -Message "authentication succeeded"
 
      - name: Validate
        shell: pwsh
        run: ./scripts/validation/Validate-ExportInputs.ps1
 
      - name: Export solutions
        shell: bash
        run: |
          set -euo pipefail
          log() { pwsh -NoProfile -File ./scripts/logging/Write-DeploymentLog.ps1 "$@"; }
          RELEASE_VERSION="$(tr -d '\r' < "$RUNNER_TEMP/release-version.txt")"
          RELEASE_FOLDER="release/Releases/v${RELEASE_VERSION}"
          mkdir -p "$RELEASE_FOLDER"
          log -Action Info -Message "export started"
          while IFS= read -r SOLUTION || [[ -n "$SOLUTION" ]]; do
            SOLUTION="${SOLUTION//$'\r'/}"
            [[ -z "$SOLUTION" ]] && continue
            log -Action Stage -Stage "export ${SOLUTION}"
            log -Action Info -Message "export started ${SOLUTION}"
            ZIP_FILE="${RUNNER_TEMP}/${SOLUTION}.zip"
            rm -rf "$RELEASE_FOLDER/$SOLUTION"
            if ! pac solution export --name "$SOLUTION" --path "$ZIP_FILE" --managed --overwrite true; then
              log -Action Error -Stage "export ${SOLUTION}" -Message "PAC export returned a non-zero status."
              exit 1
            fi
            if [[ ! -s "$ZIP_FILE" ]]; then
              log -Action Error -Stage "zip ${SOLUTION}" -Message "ZIP is missing or empty."
              exit 1
            fi
            log -Action Info -Message "zip validation passed ${SOLUTION}"
            if ! pac solution unpack --zipfile "$ZIP_FILE" --folder "$RELEASE_FOLDER/$SOLUTION" --packagetype Managed; then
              log -Action Error -Stage "unpack ${SOLUTION}" -Message "PAC unpack returned a non-zero status."
              exit 1
            fi
            log -Action Info -Message "unpack succeeded ${SOLUTION}"
          done < "$RUNNER_TEMP/solutions.txt"
          log -Action Info -Message "export finished"
 
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          log() { pwsh -NoProfile -File ./scripts/logging/Write-DeploymentLog.ps1 "$@"; }
          RELEASE_VERSION="$(tr -d '\r' < "$RUNNER_TEMP/release-version.txt")"
          AB_NUMBER="$(tr -d '\r' < "$RUNNER_TEMP/ab-number.txt")"
          MESSAGE="AB#${AB_NUMBER} Release v${RELEASE_VERSION}"
          log -Action Stage -Stage commit
          log -Action Info -Message "commit ${MESSAGE}"
          git -C release config user.name "github-actions"
          git -C release config user.email "actions@github.com"
          git -C release add -- Releases
          set +e
          git -C release diff --cached --quiet -- Releases
          diff_status=$?
          set -e
          if [[ "$diff_status" -eq 0 ]]; then
            log -Action Warn -Message "no changes to commit"
          elif [[ "$diff_status" -eq 1 ]]; then
            if ! git -C release commit -m "$MESSAGE"; then
              log -Action Error -Stage commit -Message "git commit failed."
              exit 1
            fi
            log -Action Info -Message "commit succeeded"
            log -Action Stage -Stage push
            if ! git -C release push origin "$TARGET_BRANCH"; then
              log -Action Error -Stage push -Message "git push failed."
              exit 1
            fi
            log -Action Info -Message "push succeeded"
          else
            log -Action Error -Stage commit -Message "git diff failed."
            exit "$diff_status"
          fi
 
      - name: Publish log
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: ./scripts/logging/Publish-DeploymentLog.ps1
