      #       --packagetype Managed
 
      # - name: Import and Upgrade CMdSAutomation
      #   run: |
      #     export PATH="$PATH:$HOME/.dotnet/tools"
 
      #     pac solution import \
      #       --path /tmp/CMdSAutomation.zip \
      #       --settings-file "$GITHUB_WORKSPACE/yaml-config/deployment-settings/dev2.deploymentSettings.json" \
      #       --stage-and-upgrade \
      #       --force-overwrite \
      #       --publish-changes \
      #       --async \
      #       --max-async-wait-time 60
 
