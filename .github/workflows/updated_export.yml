name: Updated Export Managed Solutions

on:
  workflow_dispatch:
    inputs:
      release_version:
        required: true
        type: string
        default: "8.17.1"
      ab_number:
        description: 'Enter Azure DevOps work item ID (numbers only)'
        required: true
        type: string
env:
  TARGET_BRANCH: Managed_Solutions
  PAC_CLI_VERSION: "2.10.1"
  AB_NUMBER: ${{ inputs.ab_number }}
  RELEASE_VERSION: ${{ inputs.release_version }}
  SOLUTIONS: "AI_Solution"

jobs:
  export:
    runs-on: windows-latest

    steps:
      - name: Checkout Managed Solutions Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Install PAC CLI
        shell: powershell
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version $env:PAC_CLI_VERSION
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Authenticate DEV
        shell: bash
        run: |
          pac auth create \
            --url "${{ secrets.DEV2_ENV_URL }}" \
            --applicationId "${{ secrets.CLIENT_ID }}" \
            --clientSecret "${{ secrets.CLIENT_SECRET }}" \
            --tenant "${{ secrets.TENANT_ID }}"

      - name: Export Managed Solutions
        shell: bash
        run: |
          RELEASE_FOLDER="Releases/v${{ github.event.inputs.release_version }}"

          if [ -d "$RELEASE_FOLDER" ]; then
              echo "Release folder already exists"
          else
              mkdir -p "$RELEASE_FOLDER"
              echo "Created release folder: $RELEASE_FOLDER"
          fi

          for SOLUTION in $SOLUTIONS; do

            echo "Processing $SOLUTION"

            ZIP_FILE="/tmp/${SOLUTION}.zip"

            pac solution export \
              --name "$SOLUTION" \
              --path "$ZIP_FILE" \
              --managed 

            pac solution unpack \
              --zipfile "$ZIP_FILE" \
              --folder "$RELEASE_FOLDER/$SOLUTION" \
              --packagetype Managed

          done

      - name: Commit Release
        shell: bash
        run: |
          # # Validate the Azure DevOps work item ID
          # if [[ ! "$AB_NUMBER" =~ ^[0-9]+$ ]]; then
          #   echo "Error: Enter a valid numeric Azure DevOps work item ID."
          #   exit 1
          # fi
 
          git config user.name "github-actions"
          git config user.email "actions@github.com"
 
          git add Releases/
 
          git commit -m "AB#$AB_NUMBER Release v$RELEASE_VERSION" || echo "No changes detected"
 
          git push origin "$TARGET_BRANCH"
