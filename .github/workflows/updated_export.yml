name: Updated Export Managed Solutions

on:
  workflow_dispatch:
    inputs:
      release_version:
        required: true
        type: string
        default: "8.17.1"
      work_items:
        description: "ADO work item IDs, comma separated. Example: 45821,45822,45830"
        required: false
        type: string

env:
  TARGET_BRANCH: Managed_Solutions
  PAC_CLI_VERSION: "2.10.1"
  SOLUTIONS: "AI_Solution"

jobs:
  export:
    runs-on: windows-latest

    steps:
      - name: Validate Inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          WORK_ITEMS: ${{ inputs.work_items }}
        run: |
          echo "release_version = '$RELEASE_VERSION'"
          echo "work_items      = '$WORK_ITEMS'"
          
      - name: Checkout Managed Solutions Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Install PAC CLI
        shell: powershell
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version $env:PAC_CLI_VERSION
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Authenticate DEV
        shell: bash
        run: |
          pac auth create \
            --url "${{ secrets.DEV2_ENV_URL }}" \
            --applicationId "${{ secrets.CLIENT_ID }}" \
            --clientSecret "${{ secrets.CLIENT_SECRET }}" \
            --tenant "${{ secrets.TENANT_ID }}"

      - name: Export Managed Solutions
        shell: bash
        run: |
          RELEASE_FOLDER="Releases/v${{ github.event.inputs.release_version }}"

          if [ -d "$RELEASE_FOLDER" ]; then
              echo "Release folder already exists"
          else
              mkdir -p "$RELEASE_FOLDER"
              echo "Created release folder: $RELEASE_FOLDER"
          fi

          for SOLUTION in $SOLUTIONS; do

            echo "Processing $SOLUTION"

            ZIP_FILE="/tmp/${SOLUTION}.zip"

            pac solution export \
              --name "$SOLUTION" \
              --path "$ZIP_FILE" \
              --managed 

            pac solution unpack \
              --zipfile "$ZIP_FILE" \
              --folder "$RELEASE_FOLDER/$SOLUTION" \
              --packagetype Managed

          done

      - name: Commit Release
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          COMMIT_MSG="Release v${RELEASE_VERSION}"
          if [ -n "$WORK_ITEMS" ]; then
            COMMIT_MSG="$COMMIT_MSG - $WORK_ITEMS"
          fi

          git add Releases/

          if git diff --cached --quiet; then
            echo "No changes detected - nothing committed"
          else
            git commit -m "$COMMIT_MSG"
          fi

          git push origin "${TARGET_BRANCH}"
