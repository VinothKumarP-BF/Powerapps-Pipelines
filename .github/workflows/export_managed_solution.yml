name: Export Managed Solutions

on:
  workflow_dispatch:
    inputs:
      release_version:
        required: true
        type: string
        default: "8.17.1"

env:
  TARGET_BRANCH: Managed_Solutions
  WORKFLOW_BRANCH: yaml
  PAC_CLI_VERSION: "2.10.1"
  SOLUTIONS: "CMdsNextGenPP_Core"

jobs:
  export:
    runs-on: windows-latest

    steps:

      # Checkout workflow branch (contains scripts)
      - name: Checkout Workflow Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKFLOW_BRANCH }}
          path: workflow-files

      # Checkout Managed_Solutions branch
      - name: Checkout Managed Solutions Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          path: managed-solutions

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PAC CLI
        shell: powershell
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version $env:PAC_CLI_VERSION
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Authenticate DEV
        shell: bash
        run: |
          pac auth create \
            --url "${{ secrets.DEV_ENV_URL }}" \
            --applicationId "${{ secrets.CLIENT_ID }}" \
            --clientSecret "${{ secrets.CLIENT_SECRET }}" \
            --tenant "${{ secrets.TENANT_ID }}"

      - name: Export Managed Solutions
        shell: bash
        run: |

          RELEASE_FOLDER="managed-solutions/Releases/v${{ github.event.inputs.release_version }}"

          mkdir -p "$RELEASE_FOLDER"

          for SOLUTION in $SOLUTIONS; do

            echo "Processing $SOLUTION"

            ZIP_FILE="$RUNNER_TEMP/${SOLUTION}.zip"

            pac solution export \
              --name "$SOLUTION" \
              --path "$ZIP_FILE" \
              --managed

            pac solution unpack \
              --zipfile "$ZIP_FILE" \
              --folder "$RELEASE_FOLDER/$SOLUTION" \
              --packagetype Managed

          done

      - name: Validate Publisher Prefix
        shell: bash
        run: |

          RELEASE_FOLDER="managed-solutions/Releases/v${{ github.event.inputs.release_version }}"

          echo "Running validation..."

          python workflow-files/scripts/validator.py "$RELEASE_FOLDER"

      - name: Commit Release
        shell: bash
        run: |

          cd managed-solutions

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add Releases/

          git diff --cached --quiet && echo "No changes detected" && exit 0

          git commit -m "Release v${{ github.event.inputs.release_version }}"

          git push origin "${{ env.TARGET_BRANCH }}"
