name: Updated Import

on:
  workflow_dispatch:
    inputs:
      release_version:
        required: true
        type: string
        default: "0.0.0.0"

env:
  PAC_CLI_VERSION: "2.10.1"
  SOURCE_BRANCH: Managed_Solutions

permissions:
  contents: read

jobs:
  import-solutions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Managed Solutions Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Checkout YAML Branch
        uses: actions/checkout@v4
        with:
          ref: yaml
          path: yaml-config

      - name: Install PAC CLI
        run: |
          dotnet tool update --global Microsoft.PowerApps.CLI.Tool --version $PAC_CLI_VERSION || \
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version $PAC_CLI_VERSION
 
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Authenticate Dev2
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"

          pac auth create \
            --url "${{ secrets.DEV2_ENV_URL }}" \
            --applicationId "${{ secrets.CLIENT_ID }}" \
            --clientSecret "${{ secrets.CLIENT_SECRET }}" \
            --tenant "${{ secrets.TENANT_ID }}"

      - name: Set Release Folder
        run: |
          echo "RELEASE_FOLDER=Releases/v${{ github.event.inputs.release_version }}" >> $GITHUB_ENV

      ###################################################
      # 1. CMdsNextGenPP_Core
      ####################################################

      # - name: Pack CMdsNextGenPP_Core
      #   run: |
      #     export PATH="$PATH:$HOME/.dotnet/tools"

      #     pac solution pack \
      #       --folder $RELEASE_FOLDER/CMdsNextGenPP_Core \
      #       --zipfile /tmp/CMdsNextGenPP_Core.zip \
      #       --packagetype Managed

      # - name: Import CMdsNextGenPP_Core
      #   run: |
      #     export PATH="$PATH:$HOME/.dotnet/tools"

      #     pac solution import \
      #       --path /tmp/CMdsNextGenPP_Core.zip \
      #       --settings-file "$GITHUB_WORKSPACE/yaml-config/deployment-settings/dev2.deploymentSettings.json" \
      #       --async \
      #       --max-async-wait-time 60
            
      ###################################################
      # 2. CMdsNextGenPP_DataModel
      ####################################################

      # - name: Pack CMdsNextGenPP_DataModel
      #   run: |
      #     export PATH="$PATH:$HOME/.dotnet/tools"

      #     pac solution pack \
      #       --folder "$RELEASE_FOLDER/CMdsNextGenPP_DataModel" \
      #       --zipfile /tmp/CMdsNextGenPP_DataModel.zip \
      #       --packagetype Managed

      # - name: Import CMdsNextGenPP_DataModel
      #   run: |
      #     export PATH="$PATH:$HOME/.dotnet/tools"

      #     pac solution import \
      #       --path /tmp/CMdsNextGenPP_DataModel.zip \
      #       --async \
      #       --max-async-wait-time 60

      ###################################################
      # 3. CMdsNextGenPP_Automation
      ####################################################

      - name: Pack CMdsNextGenPP_Automation
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"

          pac solution pack \
            --folder "$RELEASE_FOLDER/CMdsNextGenPP_Automation" \
            --zipfile /tmp/CMdsNextGenPP_Automation.zip \
            --packagetype Managed

      - name: Import CMdsNextGenPP_Automation
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"

          pac solution import \
            --path /tmp/CMdsNextGenPP_Automation.zip \
            --settings-file "$GITHUB_WORKSPACE/yaml-config/deployment-settings/dev2.deploymentSettings.json" \
            --async \
            --max-async-wait-time 60

      ###################################################
      # 4. CMdsNextGenPP_ModelApp
      ####################################################

      - name: Pack CMdsNextGenPP_ModelApp
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"

          pac solution pack \
            --folder "$RELEASE_FOLDER/CMdsNextGenPP_ModelApp" \
            --zipfile /tmp/CMdsNextGenPP_ModelApp.zip \
            --packagetype Managed

      - name: Import CMdsNextGenPP_ModelApp
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"

          pac solution import \
            --path /tmp/CMdsNextGenPP_ModelApp.zip \
            --async \
            --max-async-wait-time 60
        
      ###################################################
      # 5. CMdsNextGenPP_AppExperience
      ####################################################

      - name: Pack CMdsNextGenPP_AppExperience
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"

          pac solution pack \
            --folder "$RELEASE_FOLDER/CMdsNextGenPP_AppExperience" \
            --zipfile /tmp/CMdsNextGenPP_AppExperience.zip \
            --packagetype Managed

      - name: Import CMdsNextGenPP_AppExperience
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"

          pac solution import \
            --path /tmp/CMdsNextGenPP_AppExperience.zip \
            --async \
            --max-async-wait-time 60

      - name: Deployment Complete
        run: |
          echo "DEV2 deployment completed for release v${{ github.event.inputs.release_version }}"
