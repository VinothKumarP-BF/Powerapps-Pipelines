name: Release Export Managed Solutions

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release Version
        required: true
        type: string
        default: "0.0.0.0"

env:
  PAC_CLI_VERSION: "2.10.1"
  SOLUTIONS: "POC_CR Devops_POC"

permissions:
  contents: write

jobs:
  export:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PAC CLI
        shell: powershell
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version $env:PAC_CLI_VERSION
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Authenticate DEV
        shell: bash
        run: |
          pac auth create \
            --url "${{ secrets.DEV_ENV_URL }}" \
            --applicationId "${{ secrets.CLIENT_ID }}" \
            --clientSecret "${{ secrets.CLIENT_SECRET }}" \
            --tenant "${{ secrets.TENANT_ID }}"

      - name: Export Managed Solutions
        shell: bash
        run: |
          RELEASE_FOLDER="ReleaseAssets/v${{ github.event.inputs.release_version }}"

          mkdir -p "$RELEASE_FOLDER"

          for SOLUTION in $SOLUTIONS; do

            echo "Exporting $SOLUTION"

            pac solution export \
              --name "$SOLUTION" \
              --path "$RELEASE_FOLDER/${SOLUTION}_managed.zip" \
              --managed \
              --overwrite true

          done

      - name: Verify Exported Files
        shell: bash
        run: |
          echo "Exported Solution Files:"
          ls -la ReleaseAssets/v${{ github.event.inputs.release_version }}

      - name: Check Release Tag Does Not Exist
        shell: bash
        run: |
          TAG="v${{ github.event.inputs.release_version }}"

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "ERROR: Release tag $TAG already exists."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.release_version }}
          name: Release v${{ github.event.inputs.release_version }}
          generate_release_notes: true
          files: ReleaseAssets/v${{ github.event.inputs.release_version }}/*.zip

      - name: Release Complete
        shell: bash
        run: |
          echo "Release v${{ github.event.inputs.release_version }} created successfully."
