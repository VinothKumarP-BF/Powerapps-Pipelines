name: Release Export Managed Solutions

on:
  workflow_dispatch:
    inputs:
      release_version:
        required: true
        type: string
        default: "0.0.0.0"

env:
  TARGET_BRANCH: Managed_Solutions
  PAC_CLI_VERSION: "2.10.1"
  SOLUTIONS: "POC_CR Devops_POC"

permissions:
  contents: write

jobs:
  export:
    runs-on: windows-latest

    steps:
      - name: Checkout Managed Solutions Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Install PAC CLI
        shell: powershell
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version $env:PAC_CLI_VERSION
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Authenticate DEV
        shell: bash
        run: |
          pac auth create \
            --url "${{ secrets.DEV_ENV_URL }}" \
            --applicationId "${{ secrets.CLIENT_ID }}" \
            --clientSecret "${{ secrets.CLIENT_SECRET }}" \
            --tenant "${{ secrets.TENANT_ID }}"

      - name: Export Managed Solutions
        shell: bash
        run: |
          RELEASE_FOLDER="Releases/v${{ github.event.inputs.release_version }}"
          ASSET_FOLDER="ReleaseAssets/v${{ github.event.inputs.release_version }}"

          mkdir -p "$RELEASE_FOLDER"
          mkdir -p "$ASSET_FOLDER"

          for SOLUTION in $SOLUTIONS; do

            echo "Processing $SOLUTION"

            ZIP_FILE="$ASSET_FOLDER/${SOLUTION}_managed.zip"

            pac solution export \
              --name "$SOLUTION" \
              --path "$ZIP_FILE" \
              --managed \
              --overwrite true

            pac solution unpack \
              --zipfile "$ZIP_FILE" \
              --folder "$RELEASE_FOLDER/$SOLUTION" \
              --packagetype Managed

          done

      - name: Commit Release Contents
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add Releases/

          git commit -m "Release v${{ github.event.inputs.release_version }}" || echo "No changes detected"

          git push origin "${TARGET_BRANCH}"

      - name: Check Tag Does Not Exist
        shell: bash
        run: |
          TAG="v${{ github.event.inputs.release_version }}"

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "Tag $TAG already exists."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.release_version }}
          name: Release v${{ github.event.inputs.release_version }}
          generate_release_notes: true
          files: |
            ReleaseAssets/v${{ github.event.inputs.release_version }}/POC_CR_managed.zip
            ReleaseAssets/v${{ github.event.inputs.release_version }}/Devops_POC_managed.zip

      - name: Release Complete
        shell: bash
        run: |
          echo "Release v${{ github.event.inputs.release_version }} created successfully"
